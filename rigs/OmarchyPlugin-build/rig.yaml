version: "0.2"
name: OmarchyPlugin-build
summary: >
  The team that builds Omarchy shell plugins: an orchestrator, implementation seats each
  fixed to one model (Jev picks the seat per task), an independent QA seat, and bench
  seats the orchestrator starts when the work needs them. Launch it in the plugins folder:
  rig up rigs/OmarchyPlugin-build/rig.yaml --cwd ~/Projects/omarchy-plugins.

culture_file: CULTURE.md

# Claude seats run in Claude Code's auto mode; Codex seats keep the default sandbox.
permission_policy: builtin:auto

# Only the always-on seats are declared here, so `rig up` starts exactly these five.
# The bench seats (dev.fable, dev.qwen, review.reviewer, research.scout) and the extra-builder
# template live in bench/. The orchestrator adds one with `rig add` when it needs it; see
# CULTURE.md. The review and research pods are declared empty so `rig add` has a pod to add to.
pods:
  - id: orch
    label: Orchestration
    members:
      - id: lead
        agent_ref: "local:../../packages/daemon/specs/agents/orchestration/orchestrator"
        runtime: claude-code
        model: opus
        profile: default
        cwd: "."
    edges: []

  - id: dev
    label: Implementation
    members:
      # One implementation seat per Jev candidate, each fixed to its model. jev route picks
      # one; builder (Opus) is the default seat. QA never builds.
      - id: builder
        agent_ref: "local:../../packages/daemon/specs/agents/development/implementer"
        runtime: claude-code
        model: opus
        profile: default
        cwd: "."
      - id: sonnet
        agent_ref: "local:../../packages/daemon/specs/agents/development/implementer"
        runtime: claude-code
        model: sonnet
        profile: default
        cwd: "."
      - id: codex
        agent_ref: "local:../../packages/daemon/specs/agents/development/implementer"
        runtime: codex
        profile: default
        cwd: "."
      - id: qa
        agent_ref: "local:../../packages/daemon/specs/agents/development/qa"
        runtime: codex
        profile: default
        cwd: "."
    edges:
      - kind: delegates_to
        from: builder
        to: qa
      - kind: delegates_to
        from: sonnet
        to: qa
      - kind: delegates_to
        from: codex
        to: qa

  - id: review
    label: Review
    members: []
    edges: []

  - id: research
    label: Research
    members: []
    edges: []

edges:
  - kind: delegates_to
    from: orch.lead
    to: dev.builder
  - kind: delegates_to
    from: orch.lead
    to: dev.sonnet
  - kind: delegates_to
    from: orch.lead
    to: dev.codex
  - kind: delegates_to
    from: orch.lead
    to: dev.qa
