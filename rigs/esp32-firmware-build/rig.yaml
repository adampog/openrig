version: '0.2'
name: esp32-firmware-build
summary: 'Exactly two seats: Claude Opus lead plans and independently checks; retained
  Codex dev.qa builds and repairs. Hardware and publish actions require Alan.'
culture_file: CULTURE.md
permission_policy: builtin:auto
pods:
- id: orch
  label: Orchestration
  members:
  - id: lead
    agent_ref: local:../../packages/daemon/specs/agents/orchestration/orchestrator
    runtime: claude-code
    model: opus
    profile: default
    cwd: .
  edges: []
- id: dev
  label: Implementation
  members:
  - id: qa
    agent_ref: local:../../packages/daemon/specs/agents/development/qa
    runtime: codex
    model: gpt-6-astra
    profile: default
    cwd: .
  edges: []
- id: hw
  label: ESP32 hardware expertise
  members: []
  edges: []
edges:
- kind: delegates_to
  from: orch.lead
  to: dev.qa
startup:
  files:
  - path: README.md
    delivery_hint: send_text
    required: true
    applies_on:
    - fresh_start
    - restore
  - path: docs/TWO-SEAT-RESTORE-20261019.md
    delivery_hint: send_text
    required: true
    applies_on:
    - fresh_start
    - restore
