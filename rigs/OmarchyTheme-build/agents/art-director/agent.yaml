name: art-director
version: "1.0"
description: "Art director: owns how a theme looks, from references and the visual brief to draft reviews and what the human sees"

defaults:
  runtime: claude-code

imports:
  - ref: local:../../../../packages/daemon/specs/agents/shared

profiles:
  default:
    uses:
      skills: []
      guidance: []
      subagents: []
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-default-settings, shared:claude-default-mcp, shared:codex-default-config, shared:claude-activity-hooks]

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
