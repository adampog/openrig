version: "0.2"
name: workshop
summary: >
  A small orchestrated build team: an orchestrator in its own pod, and a builder
  and QA pair in another. It works a project's missions slice by slice, with every
  slice going build -> independent QA. Launch it from the repository it should
  work on: rig up rigs/workshop/rig.yaml --cwd <repo>.

culture_file: CULTURE.md

# Claude seats run in Claude Code's auto mode; Codex seats keep the default sandbox.
permission_policy: builtin:auto

pods:
  - id: orch
    label: Orchestration
    members:
      - id: lead
        agent_ref: "local:../../packages/daemon/specs/agents/orchestration/orchestrator"
        runtime: claude-code
        profile: default
        cwd: "."
    edges: []

  - id: dev
    label: Implementation
    members:
      - id: builder
        agent_ref: "local:../../packages/daemon/specs/agents/development/implementer"
        runtime: claude-code
        profile: default
        cwd: "."
      - id: qa
        agent_ref: "local:../../packages/daemon/specs/agents/development/qa"
        runtime: codex
        profile: default
        cwd: "."
      # Helper for dev.builder on the local Qwen model (MacBook, mlx_lm.server).
      # Its provider lives in ~/.openrig/state/pi/dev-qwen@workshop/agent/{models.json,settings.json},
      # which OpenRig does not write; it needs supportsDeveloperRole: false.
      - id: qwen
        agent_ref: "local:../../packages/daemon/specs/agents/development/implementer"
        runtime: pi
        profile: default
        cwd: "."
        startup:
          files:
            - path: qwen-helper.md
              orientation: role
              delivery_hint: guidance_merge
    edges:
      - kind: delegates_to
        from: builder
        to: qa
      - kind: delegates_to
        from: builder
        to: qwen

edges:
  - kind: delegates_to
    from: orch.lead
    to: dev.builder
  - kind: delegates_to
    from: orch.lead
    to: dev.qa
